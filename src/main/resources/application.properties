# =========================================================
# HireMind AI / NeuroHire — application configuration
# =========================================================
spring.application.name=NeuroHire
server.port=8080
server.servlet.context-path=/

# ---------- Datasource (H2 dev) ----------
spring.datasource.url=jdbc:h2:mem:neurohire;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ---------- File Upload ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.storage.local-dir=./storage/cv

# ---------- JWT ----------
app.security.jwt.secret=ZmRzYWZkc2FmZHNhZmRzYWZkc2FmZHNhZmRzYWZkc2FmZHNhZmRzYWZkc2FmZHNhZmRzYWZkc2E=
app.security.jwt.access-expiration-ms=3600000
app.security.jwt.refresh-expiration-ms=2592000000
app.security.jwt.issuer=hiremind-ai

# ---------- AI (mock LLM, future-ready for OpenAI/Anthropic) ----------
app.ai.provider=mock
app.ai.model=hiremind-mock-1
app.ai.api-key=changeme
app.ai.base-url=https://api.example.com/v1
app.ai.max-tokens=2048
app.ai.timeout-ms=15000
app.ai.bias-guard.enabled=true
app.ai.confidence-threshold=0.6

# ---------- Rate limiting (per-user, per-minute) ----------
app.rate-limit.ai-calls-per-minute=20
app.rate-limit.cv-uploads-per-day=50

# ---------- n8n integration (workflow automation) ----------
# Enable + set webhook-url to forward USER_REGISTERED, JOB_CREATED, etc. into n8n flows
app.n8n.enabled=false
app.n8n.webhook-url=
app.n8n.timeout-ms=4000

# ---------- CORS for frontend ----------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Authorization,X-Correlation-Id
app.cors.allow-credentials=true
app.cors.max-age=3600

# ---------- Swagger / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.ltc.NeuroHire=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.level=%5p [%X{correlationId:-}]

# ---------- Mail (dev placeholder) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=changeme@example.com
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=no-reply@hiremind.ai

# ---------- App meta ----------
app.product.name=HireMind AI
app.product.version=0.1.0-MVP
