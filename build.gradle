plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.ltc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	implementation 'org.apache.pdfbox:pdfbox:3.0.3'
	implementation 'org.apache.poi:poi-ooxml:5.3.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Frontend (Vite + React) build integration
// ---------------------------------------------------------------------------
def frontendDir   = file("$projectDir/frontend")
def frontendDist  = file("$projectDir/src/main/resources/static")
def npmCmd        = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
	description = 'Install frontend npm dependencies'
	group       = 'frontend'
	workingDir  = frontendDir
	commandLine npmCmd, 'install', '--no-fund', '--no-audit'
	inputs.file file("$frontendDir/package.json")
	outputs.dir file("$frontendDir/node_modules")
	onlyIf { frontendDir.exists() }
}

tasks.register('frontendBuild', Exec) {
	description = 'Build the React frontend into src/main/resources/static'
	group       = 'frontend'
	dependsOn   'frontendInstall'
	workingDir  = frontendDir
	commandLine npmCmd, 'run', 'build'
	inputs.dir   file("$frontendDir/src")
	inputs.file  file("$frontendDir/index.html")
	inputs.file  file("$frontendDir/vite.config.ts")
	inputs.file  file("$frontendDir/tailwind.config.js")
	outputs.dir  frontendDist
	onlyIf { frontendDir.exists() }
}

tasks.named('processResources') {
	dependsOn 'frontendBuild'
}

tasks.register('frontendClean', Delete) {
	description = 'Clean frontend build output'
	group       = 'frontend'
	delete frontendDist
}
